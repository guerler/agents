# Formatting and linting for this repo. There is no package to build here: the evals,
# seams and comparison tools are run in place against a checkout named by OLIT_ROOT.

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]

# Literals an agent or a reader sees verbatim: the source snippets a mutation swaps in, and
# the prose describing how a layer diverges. Reflowing them changes the text, not the layout.
[tool.ruff.lint.per-file-ignores]
"evals/falsify.py" = ["E501"]
# Standalone probes that put the agent under test on sys.path before importing it, so the
# imports cannot come first.
"evals/claims/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
